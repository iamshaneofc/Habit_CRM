services:
  - type: web
    name: focus-os
    runtime: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: focus-os-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: focus-os-db
    databaseName: habit_crm_db
    user: habit_user
    plan: free

