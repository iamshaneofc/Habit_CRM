<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Habit CRM</title>
    <meta name="description" content="Sign in to your personal Habit CRM and Life OS daily consistency tracker.">
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=20261107_v5">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow-glass);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-logo {
            width: 52px;
            height: 52px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, var(--accent-emerald), var(--accent-cyan));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 15px var(--accent-emerald-glow);
        }
        .auth-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }
        .auth-title span {
            color: var(--accent-emerald);
        }
        .auth-sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .auth-error {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.4);
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
            display: none;
        }
        .auth-field {
            margin-bottom: 1.25rem;
        }
        .auth-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .auth-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
        }
        .auth-input:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-emerald-glow);
        }
        .auth-btn {
            width: 100%;
            padding: 0.85rem;
            margin-top: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0 1.25rem;
            color: var(--text-muted);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        .auth-divider span {
            padding: 0 0.75rem;
        }
        .auth-demo-btn {
            width: 100%;
            padding: 0.85rem 1rem;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(6, 182, 212, 0.12));
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            text-decoration: none;
            position: relative;
        }
        .auth-demo-btn:hover {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.22), rgba(6, 182, 212, 0.22));
            border-color: var(--accent-emerald);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }
        .auth-demo-btn:active {
            transform: translateY(0);
        }
        .demo-btn-content {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            width: 100%;
            text-align: left;
        }
        .demo-icon {
            font-size: 1.35rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            flex-shrink: 0;
            box-shadow: 0 2px 8px var(--accent-emerald-glow);
        }
        .demo-text-wrap {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 0.2rem;
        }
        .demo-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }
        .demo-title-row strong {
            font-size: 0.95rem;
            color: #ffffff;
            font-weight: 700;
        }
        .demo-badge {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.2rem 0.55rem;
            border-radius: 9999px;
            background: rgba(6, 182, 212, 0.22);
            color: var(--accent-cyan);
            border: 1px solid rgba(6, 182, 212, 0.4);
            white-space: nowrap;
        }
        .demo-subtitle {
            font-size: 0.76rem;
            color: var(--text-secondary);
            font-weight: 400;
            line-height: 1.3;
        }
        .demo-credentials-note {
            margin-top: 0.85rem;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .demo-credentials-note code {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-color);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            color: var(--accent-cyan);
            font-family: monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .demo-credentials-note code:hover {
            background: rgba(6, 182, 212, 0.15);
            border-color: var(--accent-cyan);
            color: #ffffff;
        }
        .demo-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(16, 185, 129, 0.3);
            border-top-color: var(--accent-emerald);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .auth-footer a {
            color: var(--accent-emerald);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">⚡</div>
                <h1 class="auth-title">Habit<span>CRM</span></h1>
                <p class="auth-sub">Welcome back! Sign in to track your habits.</p>
            </div>

            <div id="auth-error-box" class="auth-error"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="auth-field">
                    <label for="email" class="auth-label">Email Address</label>
                    <input type="email" id="email" class="auth-input" required placeholder="you@example.com" autocomplete="email">
                </div>

                <div class="auth-field">
                    <label for="password" class="auth-label">Password</label>
                    <input type="password" id="password" class="auth-input" required placeholder="••••••••" autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary auth-btn" id="login-btn">Sign In</button>
            </form>

            <div class="auth-divider">
                <span>or explore without an account</span>
            </div>

            <button type="button" class="btn auth-demo-btn" id="demo-btn" onclick="handleDemoLogin(event)">
                <div class="demo-btn-content">
                    <span class="demo-icon">⚡</span>
                    <div class="demo-text-wrap">
                        <div class="demo-title-row">
                            <strong>One-Click Demo Sign In</strong>
                            <span class="demo-badge">All Features Active</span>
                        </div>
                        <span class="demo-subtitle">Preloaded habits, streaks, real-time charts &amp; notes</span>
                    </div>
                </div>
            </button>

            <div class="demo-credentials-note">
                <span>Direct test account: <code onclick="prefillDemo('demo@habitcrm.com', 'demo123')" title="Click to fill form">demo@habitcrm.com</code> / <code onclick="prefillDemo('demo@habitcrm.com', 'demo123')" title="Click to fill form">demo123</code></span>
            </div>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Create one here</a>
            </div>
        </div>
    </div>

    <script>
        function prefillDemo(email, pass) {
            document.getElementById("email").value = email;
            document.getElementById("password").value = pass;
            const errBox = document.getElementById("auth-error-box");
            if (errBox) errBox.style.display = "none";
            document.getElementById("password").focus();
        }

        async function handleDemoLogin(e) {
            if (e) e.preventDefault();
            const errBox = document.getElementById("auth-error-box");
            const demoBtn = document.getElementById("demo-btn");
            const loginBtn = document.getElementById("login-btn");

            errBox.style.display = "none";
            demoBtn.disabled = true;
            loginBtn.disabled = true;

            const originalContent = demoBtn.innerHTML;
            demoBtn.innerHTML = `
                <div class="demo-btn-content" style="justify-content: center; width: 100%;">
                    <span class="demo-spinner"></span>
                    <strong style="margin-left: 0.5rem; color: #10b981;">Launching Demo Environment...</strong>
                </div>
            `;

            try {
                const res = await fetch("/api/auth/demo-login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Unable to initialize demo account.");
                }
                window.location.href = "/";
            } catch (err) {
                errBox.textContent = err.message;
                errBox.style.display = "block";
                demoBtn.disabled = false;
                loginBtn.disabled = false;
                demoBtn.innerHTML = originalContent;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const errBox = document.getElementById("auth-error-box");
            const btn = document.getElementById("login-btn");

            errBox.style.display = "none";
            btn.disabled = true;
            btn.textContent = "Signing in...";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Invalid credentials");
                }
                window.location.href = "/";
            } catch (err) {
                errBox.textContent = err.message;
                errBox.style.display = "block";
                btn.disabled = false;
                btn.textContent = "Sign In";
            }
        }
    </script>
</body>
</html>
